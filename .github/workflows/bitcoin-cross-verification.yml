
name: BitcoinQuantum Genesis API Crosscheck

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/bitcoin-cross-verification.yml'

permissions:
  contents: read

jobs:
  bitcoin-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Crosscheck public Bitcoin address data
        shell: bash
        env:
          UNISAT_API_KEY: ${{ secrets.UNISAT_API_KEY }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import datetime
          import hashlib
          import json
          import os
          import urllib.request

          ADDRESS = '1A1zP1eP5QGefi2DMPTfTL5SLmv7DivfNa'
          sources = {}

          def fetch(url, headers=None, plain=False):
              h = {'User-Agent': 'BitcoinQuantum-Public-Audit/1.0',
                   'Accept': 'application/json'}
              h.update(headers or {})
              req = urllib.request.Request(url, headers=h)
              with urllib.request.urlopen(req, timeout=40) as response:
                  data = response.read(3000001)
              if len(data) > 3000000:
                  raise ValueError('response too large')
              text = data.decode('utf-8').strip()
              return text if plain else json.loads(text)

          def record(name, fn):
              try:
                  sources[name] = {'status': 'OK', 'data': fn()}
                  print('OK | ' + name)
              except Exception as error:
                  sources[name] = {
                      'status': 'UNAVAILABLE',
                      'error_type': type(error).__name__,
                      'http_code': getattr(error, 'code', None)
                  }
                  print('UNAVAILABLE | ' + name + ' | ' + type(error).__name__)

          def esplora(base):
              tip = int(fetch(base + '/blocks/tip/height', plain=True))
              obj = fetch(base + '/address/' + ADDRESS)
              if obj.get('address') != ADDRESS:
                  raise ValueError('wrong address')
              chain = obj['chain_stats']
              mempool = obj['mempool_stats']
              fields = ('tx_count', 'funded_txo_count', 'spent_txo_count',
                        'funded_txo_sum', 'spent_txo_sum')
              stats = {k: int(chain[k]) for k in fields}
              mem = {k: int(mempool[k]) for k in fields}
              confirmed = stats['funded_txo_sum'] - stats['spent_txo_sum']
              if confirmed < 0:
                  raise ValueError('negative confirmed balance')
              return {'tip_height': tip, 'chain_stats': stats,
                      'mempool_stats': mem, 'confirmed_sats': confirmed}

          record('mempool.space', lambda: esplora('https://mempool.space/api'))
          record('Blockstream Esplora', lambda: esplora('https://blockstream.info/api'))

          def blockchain_com():
              obj = fetch('https://blockchain.info/rawaddr/' + ADDRESS + '?limit=1')
              if obj.get('address') != ADDRESS:
                  raise ValueError('wrong address')
              return {k: int(obj[k]) for k in
                      ('n_tx', 'total_received', 'total_sent', 'final_balance')}

          record('Blockchain.com', blockchain_com)

          token = os.environ.get('UNISAT_API_KEY', '').strip()
          if token:
              def unisat():
                  obj = fetch(
                      'https://open-api.unisat.io/v1/indexer/address/'
                      + ADDRESS + '/available-balance',
                      headers={'Authorization': 'Bearer ' + token})
                  if obj.get('code') != 0:
                      raise ValueError('nonzero UniSat API code')
                  data = obj['data']
                  return {'available_sats': int(data['availableBalance']),
                          'total_sats': int(data['totalBalance']),
                          'definition': 'UniSat protocol-filtered balance'}
              record('UniSat', unisat)
          else:
              sources['UniSat'] = {
                  'status': 'NOT_RUN_NO_TOKEN',
                  'note': 'Optional GitHub Actions secret UNISAT_API_KEY not set'}

          a = sources['mempool.space']
          b = sources['Blockstream Esplora']
          status = 'INCONCLUSIVE'
          reason = 'One or both Esplora providers unavailable'
          if a['status'] == 'OK' and b['status'] == 'OK':
              x, y = a['data'], b['data']
              if x['tip_height'] != y['tip_height']:
                  reason = 'Different observed tip heights'
              elif (x['chain_stats'] == y['chain_stats']
                    and x['confirmed_sats'] == y['confirmed_sats']):
                  status = 'MATCH'
                  reason = 'Same tip height and confirmed address statistics'
              else:
                  status = 'MISMATCH'
                  reason = 'Confirmed address statistics differ at same tip height'

          report = {
              'address': ADDRESS,
              'observed_utc': datetime.datetime.now(
                  datetime.timezone.utc).isoformat(),
              'sources': sources,
              'esplora_comparison': {'status': status, 'reason': reason},
              'blockchain_com_comparison': 'REPORTED_SEPARATELY',
              'unisat_comparison': 'REPORTED_SEPARATELY',
              'full_utxo_identity_audit': 'NOT_PERFORMED',
              'genesis_key_control': 'NOT_VERIFIED',
              'legal_ownership': 'NOT_DETERMINED',
              'note': ('API statistics can have different definitions and snapshots. '
                       'Matching providers are not independent Bitcoin consensus proof.')
          }
          with open('bitcoin_crosscheck_report.json', 'w') as f:
              json.dump(report, f, indent=2, sort_keys=True)
          data = open('bitcoin_crosscheck_report.json', 'rb').read()
          digest = hashlib.sha256(data).hexdigest()
          with open('bitcoin_crosscheck_sha256.txt', 'w') as f:
              f.write(digest + '  bitcoin_crosscheck_report.json\n')
          print('ESPLORA CROSSCHECK: ' + status)
          print('REASON: ' + reason)
          print('UNISAT: ' + sources['UniSat']['status'])
          print('BLOCKCHAIN.COM: ' + sources['Blockchain.com']['status'])
          print('FULL UTXO AUDIT: NOT PERFORMED')
          print('GENESIS KEY CONTROL: NOT VERIFIED')
          print('REPORT SHA256: ' + digest)
          PY

      - name: Save public crosscheck evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitcoinquantum-genesis-crosscheck
          path: |
            bitcoin_crosscheck_report.json
            bitcoin_crosscheck_sha256.txt
          if-no-files-found: warn
